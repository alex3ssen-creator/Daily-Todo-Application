<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- design tokens ---------- */
const BG = "#14181F", SURFACE = "#1E2430", SURFACE2 = "#262E3D";
const TEXT = "#E8E6DE", MUTED = "#8B93A3", BORDER = "#2E3646";
const ACCENT = "#D4A24C", DANGER = "#C9705E", WHITE = "#FFFFFF";

const DEFAULT_CATEGORIES = [
  { id: "health", label: "Health", color: "#6FA88A" },
  { id: "selfhelp", label: "Self-help", color: "#B6764F" },
  { id: "cleaning", label: "Cleaning", color: "#5C8DBF" },
  { id: "home", label: "Home", color: "#9B7EC2" },
  { id: "work", label: "Work", color: "#8C8566" },
  { id: "learning", label: "Learning", color: "#4FA8AE" },
  { id: "personal", label: "Personal", color: "#C97BA0" },
];

const PROJECT_COLORS = ["#D4A24C", "#6FA88A", "#5C8DBF", "#9B7EC2", "#B6764F", "#4FA8AE", "#C97BA0"];

const CELEBRATION_MESSAGES = [
  "Every task done. That's real momentum — see you tomorrow.",
  "Full day, well earned. Rest easy tonight.",
  "That's the whole list, gone. Nice work today.",
  "Day complete. Small steps add up to real progress.",
  "You showed up for all of it today. That matters.",
  "Nothing left on the list. Tomorrow's a fresh page.",
  "Consistency like this is what actually changes things. Well done.",
];

const DOC_COLLECTION = "trackers";
const SHARED_PROJECTS_COLLECTION = "sharedProjects";
const SENT_TASKS_COLLECTION = "sentTasks";

/* ---------- helpers ---------- */
const pad = (n) => String(n).padStart(2, "0");
const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const uid = (p) => `${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const normalizeWeekdays = (w) => (w && w.length ? w : [0, 1, 2, 3, 4, 5, 6]);
const normalizeTask = (t) => ({ targetCount: 1, remind: false, remindFrom: "09:00", remindTo: "18:00", oneTime: false, ...t });
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const emailShort = (email) => (email ? email.split("@")[0] : "");

function hexToRgba(hex, alpha) {
  const c = hex.replace("#", "");
  const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function buildRing(tasks, categories) {
  if (!tasks || tasks.length === 0) return { background: "#2A3140" };
  const total = tasks.length;
  let cum = 0;
  const stops = [];
  categories.forEach((cat) => {
    const inCat = tasks.filter((t) => t.category === cat.id);
    if (inCat.length === 0) return;
    const catAngle = (inCat.length / total) * 360;
    const doneCount = inCat.filter((t) => t.done).length;
    const doneAngle = catAngle * (doneCount / inCat.length);
    const start = cum, mid = cum + doneAngle, end = cum + catAngle;
    stops.push(`${cat.color} ${start}deg ${mid}deg`);
    stops.push(`${hexToRgba(cat.color, 0.18)} ${mid}deg ${end}deg`);
    cum = end;
  });
  return { background: `conic-gradient(${stops.join(", ")})` };
}

function migrate(raw) {
  let tasks, dailyLogs;
  if (raw.tasks) {
    tasks = raw.tasks;
    dailyLogs = raw.dailyLogs || {};
  } else {
    tasks = (raw.recurringTasks || []).map((t) => ({ ...t, isDaily: true, done: false }));
    dailyLogs = {};
    Object.entries(raw.dailyLogs || {}).forEach(([k, list]) => {
      dailyLogs[k] = list.map((t) => ({ ...t, taskId: t.recurringId ?? t.taskId ?? null }));
    });
  }
  const categories = raw.categories && raw.categories.length ? raw.categories : DEFAULT_CATEGORIES;
  const projects = raw.projects || [];
  const projectItems = raw.projectItems || [];
  const somedayLabel = raw.somedayLabel || "Someday";
  return { tasks: tasks.map(normalizeTask), dailyLogs, categories, projects, projectItems, somedayLabel };
}

function generateIfNeeded(data, key) {
  if (data.dailyLogs[key]) return data;
  const d = new Date(`${key}T00:00:00`);
  const wd = d.getDay();
  const tasks = data.tasks
    .filter((t) => t.isDaily && t.weekdays.includes(wd))
    .map((t) => ({ id: uid("t"), name: t.name, category: t.category, done: false, taskId: t.id, targetCount: t.targetCount || 1, count: 0 }));
  return { ...data, dailyLogs: { ...data.dailyLogs, [key]: tasks } };
}

function getMonthGrid(year, month) {
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const numDays = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= numDays; d++) cells.push(new Date(year, month, d));
  return cells;
}

function computeStreak(dailyLogs, todayKey) {
  let count = 0;
  const cursor = new Date(`${todayKey}T00:00:00`);
  while (true) {
    const key = dateKey(cursor);
    const tasks = dailyLogs[key];
    if (!tasks || tasks.length === 0 || !tasks.some((t) => t.done)) break;
    count++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return count;
}

function whenFirebaseReady(cb) {
  if (window.fb) cb(window.fb);
  else window.addEventListener("fb-ready", () => cb(window.fb), { once: true });
}

function seededTimeWithinWindow(dayKeyStr, taskId, from, to) {
  const seedStr = dayKeyStr + taskId;
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) h = (h * 31 + seedStr.charCodeAt(i)) >>> 0;
  const frac = (h % 10000) / 10000;
  const [fh, fm] = from.split(":").map(Number);
  const [th, tm] = to.split(":").map(Number);
  const dayStart = new Date(`${dayKeyStr}T00:00:00`).getTime();
  const fromMs = dayStart + (fh * 60 + fm) * 60000;
  const toMs = dayStart + (th * 60 + tm) * 60000;
  const span = Math.max(toMs - fromMs, 60000);
  return fromMs + frac * span;
}

function fireConfetti() {
  if (typeof confetti === "undefined") return;
  const colors = [ACCENT, "#6FA88A", "#5C8DBF", "#C97BA0"];
  confetti({ particleCount: 90, spread: 75, origin: { y: 0.6 }, colors });
  setTimeout(() => confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 }, colors }), 200);
  setTimeout(() => confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 }, colors }), 200);
}

/* ---------- small components ---------- */
function RingProgress({ tasks, categories, size = 96, thickness = 10, showPercent = true }) {
  const total = tasks ? tasks.length : 0;
  const done = tasks ? tasks.filter((t) => t.done).length : 0;
  const pct = total ? Math.round((done / total) * 100) : null;
  const style = buildRing(tasks, categories);
  return (
    <div style={{ position: "relative", width: size, height: size, borderRadius: "50%", flexShrink: 0, ...style }}>
      <div style={{ position: "absolute", inset: thickness, borderRadius: "50%", background: BG, display: "flex", alignItems: "center", justifyContent: "center" }}>
        {showPercent && (
          <span style={{ fontFamily: '"IBM Plex Mono", monospace', fontSize: size * 0.22, color: TEXT, fontWeight: 600 }}>
            {pct === null ? "–" : `${pct}%`}
          </span>
        )}
      </div>
    </div>
  );
}

function Toggle({ on, onClick }) {
  return (
    <button onClick={onClick} style={{ width: 40, height: 22, borderRadius: 11, background: on ? ACCENT : BORDER, position: "relative", flexShrink: 0 }}>
      <span style={{ position: "absolute", top: 2, left: on ? 20 : 2, width: 18, height: 18, borderRadius: "50%", background: on ? BG : MUTED, transition: "left 0.15s" }} />
    </button>
  );
}

function Stepper({ value, onDec, onInc }) {
  return (
    <div className="flex items-center gap-3">
      <button onClick={onDec} style={{ width: 28, height: 28, borderRadius: "50%", background: SURFACE2, border: `1px solid ${BORDER}`, color: TEXT, fontSize: 15 }}>−</button>
      <span style={{ fontFamily: '"IBM Plex Mono", monospace', width: 20, textAlign: "center", fontSize: 14, color: TEXT }}>{value}</span>
      <button onClick={onInc} style={{ width: 28, height: 28, borderRadius: "50%", background: SURFACE2, border: `1px solid ${BORDER}`, color: TEXT, fontSize: 15 }}>+</button>
    </div>
  );
}

function EmptyState({ message, cta, onClick }) {
  return (
    <div className="text-center py-10">
      <div style={{ color: MUTED, fontSize: 14, marginBottom: 16 }}>{message}</div>
      <button onClick={onClick} className="px-5 py-2.5 rounded-xl" style={{ background: ACCENT, color: WHITE, fontSize: 13, fontWeight: 700 }}>{cta}</button>
    </div>
  );
}

function TaskRow({ task, onTap, onRemove }) {
  const target = task.targetCount || 1;
  const count = task.count || 0;
  return (
    <div className="flex items-center gap-3 py-2 px-3 rounded-xl" style={{ background: SURFACE2 }}>
      <button
        onClick={onTap}
        style={{
          width: 26, height: 26, borderRadius: 8, flexShrink: 0,
          border: `2px solid ${task.done ? ACCENT : BORDER}`,
          background: task.done ? ACCENT : "transparent",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}
      >
        {task.done ? (
          <span style={{ color: WHITE, fontSize: 14, fontWeight: 800 }}>✓</span>
        ) : target > 1 && count > 0 ? (
          <span style={{ color: ACCENT, fontSize: 11, fontWeight: 700 }}>{count}</span>
        ) : null}
      </button>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 14, textDecoration: task.done ? "line-through" : "none", color: task.done ? MUTED : TEXT }}>{task.name}</div>
        {target > 1 && <div style={{ fontSize: 11, color: MUTED }}>{count}/{target} today</div>}
      </div>
      <button onClick={onRemove} style={{ color: MUTED, fontSize: 16, lineHeight: 1 }}>×</button>
    </div>
  );
}

function BottomNav({ view, setView }) {
  const items = [
    { id: "today", label: "Today", icon: "☰" },
    { id: "calendar", label: "Calendar", icon: "▦" },
    { id: "projects", label: "Projects", icon: "▤" },
    { id: "manage", label: "Tasks", icon: "⚙" },
  ];
  return (
    <div className="w-full flex" style={{ background: SURFACE, borderTop: `1px solid ${BORDER}` }}>
      {items.map(({ id, label, icon }) => (
        <button key={id} onClick={() => setView(id)} className="flex-1 flex flex-col items-center gap-1 py-2.5">
          <span style={{ fontSize: 17, color: view === id ? ACCENT : MUTED }}>{icon}</span>
          <span style={{ fontSize: 10, color: view === id ? ACCENT : MUTED }}>{label}</span>
        </button>
      ))}
    </div>
  );
}

function GoogleGIcon() {
  return (
    <svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.6 0-14.2 4.3-17.7 10.7z"/>
      <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.7 39.6 16.3 44 24 44z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.6 5.4C41.4 35.8 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/>
    </svg>

}

function SignInScreen({ onSignIn, error }) {
  return (
    <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
      <div style={{ fontFamily: "Fraunces, serif", fontSize: 30, fontWeight: 600, color: TEXT }}>Ledger</div>
      <div style={{ color: MUTED, fontSize: 14, marginTop: 8, marginBottom: 28 }}>Sign in to sync your tasks across devices.</div>
      <button onClick={onSignIn} className="px-5 py-3 rounded-xl flex items-center gap-3" style={{ background: SURFACE2, border: `1px solid ${BORDER}`, color: TEXT, fontSize: 14 }}>
        <GoogleGIcon /> Sign in with Google
      </button>
      {error && <div style={{ color: DANGER, fontSize: 12, marginTop: 16 }}>{error}</div>}

}

  return (
    <div className="flex items-center justify-between px-5 py-3" style={{ borderBottom: `1px solid ${BORDER}` }}>
      <div className="flex items-center gap-2 min-w-0">
        {user.photoURL && <img src={user.photoURL} referrerPolicy="no-referrer" style={{ width: 24, height: 24, borderRadius: "50%", flexShrink: 0 }} />}

          ✉
          {inboxCount > 0 && (
            <span style={{ position: "absolute", top: -6, right: -8, background: ACCENT, color: WHITE, fontSize: 9, fontWeight: 700, borderRadius: 999, minWidth: 15, height: 15, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px" }}>
              {inboxCount}
            </span>
          )}
        </button>
        <button onClick={onSignOut} style={{ fontSize: 12, color: MUTED }}>Sign out</button>
      </div>
    </div>
  );
}

function NotifBanner({ onEnable }) {
  return (
    <div className="mx-5 mt-4 mb-1 p-3 rounded-xl flex items-center justify-between gap-3" style={{ background: SURFACE2, border: `1px solid ${BORDER}` }}>
      <span style={{ fontSize: 12, color: MUTED }}>Enable notifications so Ledger can remind you</span>
      <button onClick={onEnable} style={{ fontSize: 12, color: ACCENT, fontWeight: 700, flexShrink: 0 }}>Enable</button>
    </div>

}

function InstallSection({ iosMode, onInstallClick, message }) {
  return (
    <div className="mt-8">
      <div style={{ fontSize: 11, color: MUTED, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 8 }}>Home Screen</div>
      {iosMode ? (
        <div className="p-3 rounded-xl" style={{ background: SURFACE, border: `1px solid ${BORDER}` }}>
          <div style={{ fontSize: 12, color: MUTED }}>
            On iPhone: tap the <b style={{ color: TEXT }}>Share</b> button in Safari, then <b style={{ color: TEXT }}>Add to Home Screen</b>.
          </div>
        </div>
      ) : (
        <>
          <button onClick={onInstallClick} className="w-full py-3 rounded-xl flex items-center justify-center gap-2" style={{ background: SURFACE, border: `1px solid ${BORDER}`, color: TEXT }}>
            + Add to Home Screen
          </button>
          {message && <div style={{ fontSize: 11, color: MUTED, marginTop: 8, textAlign: "center" }}>{message}</div>}
        </>
      )}
    </div>

}

function BackupSection({ onExport }) {
  return (
    <div className="mt-8">
      <div style={{ fontSize: 11, color: MUTED, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 8 }}>Backup</div>
      <button onClick={onExport} className="w-full py-3 rounded-xl flex items-center justify-center gap-2" style={{ background: SURFACE, border: `1px solid ${BORDER}`, color: TEXT }}>
        + Download my data
      </button>
      <div style={{ fontSize: 11, color: MUTED, marginTop: 8 }}>Saves a copy of everything on your device — worth doing every so often.</div>
    </div>
  );
}

function InboxItemRow({ item, onAccept, onDecline }) {
  return (
    <div className="flex items-center gap-3 py-2.5 px-3 rounded-xl" style={{ background: SURFACE2 }}>
      <div className="flex-1 min-w-0">
        <div style={{ fontSize: 14, color: TEXT }}>{item.name}</div>
        <div style={{ fontSize: 11, color: MUTED }}>from {emailShort(item.fromEmail)}</div>
      </div>
      <button onClick={onDecline} style={{ color: MUTED, fontSize: 13 }}>Decline</button>
      <button onClick={onAccept} style={{ color: ACCENT, fontSize: 13, fontWeight: 700 }}>Accept</button>
    </div>
  );
}

function InboxSheet({ items, categories, onClose, onAccept, onDecline, onSend }) {
  const [composing, setComposing] = useState(false);
  const [toEmail, setToEmail] = useState("");
  const [name, setName] = useState("");
  const [category, setCategory] = useState(categories[0]?.id);
  const [sent, setSent] = useState(false);

  const submit = () => {
    if (!toEmail.trim() || !name.trim()) return;
    onSend({ toEmail: toEmail.trim(), name: name.trim(), category });
    setSent(true);
    setToEmail(""); setName("");
    setTimeout(() => setSent(false), 2500);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ background: "rgba(0,0,0,0.55)" }}>
      <div onClick={(e) => e.stopPropagation()} className="w-full rounded-t-3xl p-5" style={{ maxWidth: 430, background: SURFACE, maxHeight: "85vh", overflowY: "auto" }}>
        <div className="flex justify-between items-center mb-4">
          <div style={{ fontFamily: "Fraunces, serif", fontSize: 18, fontWeight: 600, color: TEXT }}>Inbox</div>
          <button onClick={onClose} style={{ color: MUTED, fontSize: 18 }}>×</button>
        </div>

        <div style={{ fontSize: 11, color: MUTED, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 8 }}>Sent to you</div>
        {items.length === 0 ? (
          <div style={{ fontSize: 13, color: MUTED, marginBottom: 20 }}>Nothing waiting right now.</div>
        ) : (
          <div className="space-y-2 mb-6">
            {items.map((it) => (<InboxItemRow key={it.id} item={it} onAccept={() => onAccept(it)} onDecline={() => onDecline(it.id)} />))}
          </div>
        )}

        {!composing ? (
          <button onClick={() => setComposing(true)} className="w-full py-3 rounded-xl flex items-center justify-center gap-2" style={{ background: SURFACE2, border: `1px solid ${BORDER}`, color: TEXT }}>
            + Send someone a to-do
          </button>
        ) : (
          <div className="mt-2">
            <div style={{ fontSize: 11, color: MUTED, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 8 }}>Send a to-do</div>
            <input value={toEmail} onChange={(e) => setToEmail(e.target.value)} placeholder="their@email.com" className="w-full px-4 py-3 rounded-xl mb-3" style={{ background: SURFACE2, color: TEXT, border: `1px solid ${BORDER}`, fontSize: 14 }} />
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Task name" className="w-full px-4 py-3 rounded-xl mb-3" style={{ background: SURFACE2, color: TEXT, border: `1px solid ${BORDER}`, fontSize: 14 }} />
            <div className="flex flex-wrap gap-2 mb-4">
              {categories.map((cat) => (
                <button key={cat.id} onClick={() => setCategory(cat.id)} className="px-3 py-2 rounded-full flex items-center gap-2" style={{ border: `1.5px solid ${category === cat.id ? cat.color : BORDER}`, background: category === cat.id ? hexToRgba(cat.color, 0.15) : "transparent" }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: cat.color }} />
                  <span style={{ fontSize: 12, color: TEXT }}>{cat.label}</span>
                </button>
              ))}
            </div>
            <button onClick={submit} className="w-full py-3 rounded-xl" style={{ background: ACCENT, color: WHITE, fontWeight: 700, fontSize: 14 }}>Send</button>
            {sent && <div style={{ fontSize: 12, color: ACCENT, textAlign: "center", marginTop: 8 }}>Sent!</div>}
          </div>
        )}
      </div>

/* ---------- views: today / calendar ---------- */
function TodayView({ data, todayKey, categories, onTap, onRemove, onOpenAdd }) {
  const tasks = data.dailyLogs[todayKey] || [];
  const streak = computeStreak(data.dailyLogs, todayKey);
  const activeCats = categories.filter((cat) => tasks.some((t) => t.category === cat.id));
  return (
    <div className="px-5 pt-6 pb-8">
      <div className="flex items-center justify-between mb-1">

          <div style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, color: TEXT }}>Today</div>

        </div>
        <RingProgress tasks={tasks} categories={categories} size={72} thickness={8} />
      </div>
      {streak > 1 && <div style={{ color: ACCENT, fontSize: 12, marginTop: 4 }}>{streak}-day streak</div>}
      {tasks.length === 0 ? (
        <div className="mt-4">
          <EmptyState message="Nothing marked Daily yet. Add a task, or flip one in Tasks to Daily." cta="Add a task" onClick={() => onOpenAdd()} />

        <div className="mt-5 space-y-5">
          {activeCats.map((cat) => (
            <div key={cat.id}>
              <div className="flex items-center gap-2 mb-2">
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: cat.color }} />
                <span style={{ fontSize: 11, color: MUTED, letterSpacing: 0.5, textTransform: "uppercase" }}>{cat.label}</span>
              </div>
              <div className="space-y-2">
                {tasks.filter((t) => t.category === cat.id).map((t) => (
                  <TaskRow key={t.id} task={t} onTap={() => onTap(t.id)} onRemove={() => onRemove(t.id)} />

              </div>
            </div>
          ))}
        </div>
      )}
      {tasks.length > 0 && (
        <button onClick={() => onOpenAdd()} className="mt-6 w-full py-3 rounded-xl flex items-center justify-center gap-2" style={{ background: SURFACE, border: `1px solid ${BORDER}`, color: TEXT }}>

function CalendarView({ data, categories, monthDate, setMonthDate, onOpenDay }) {
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const cells = getMonthGrid(year, month);
  const todayKey = dateKey(new Date());
  return (
    <div className="px-5 pt-6 pb-8">
      <div className="flex items-center justify-between mb-5">
        <button onClick={() => setMonthDate(new Date(year, month - 1, 1))} style={{ color: MUTED, fontSize: 20 }}>‹</button>
        <div style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, color: TEXT }}>{monthDate.toLocaleDateString("en-US", { month: "long", year: "numeric" })}</div>
        <button onClick={() => setMonthDate(new Date(year, month + 1, 1))} style={{ color: MUTED, fontSize: 20 }}>›</button>
      </div>
      <div className="grid grid-cols-7 mb-2">
        {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => (<div key={i} className="text-center" style={{ fontSize: 11, color: MUTED }}>{d}</div>))}
      </div>
      <div className="grid grid-cols-7 gap-y-3">
        {cells.map((d, i) => {
          if (!d) return <div key={i} />;
          const key = dateKey(d);
          const tasks = data.dailyLogs[key];
          const isToday = key === todayKey;
          return (
            <button key={i} onClick={() => onOpenDay(key)} className="flex items-center justify-center">
              <div style={{ position: "relative", width: 36, height: 36 }}>
                <RingProgress tasks={tasks} categories={categories} size={36} thickness={4} showPercent={false} />
                <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: isToday ? ACCENT : TEXT, fontWeight: isToday ? 700 : 400 }}>

              </div>
            </button>

        })}
      </div>
    </div>

/* ---------- views: tasks / categories ---------- */
function TaskManageRow({ task, categories, onEdit, onToggleDaily, onToggleDone }) {
  const cat = categories.find((c) => c.id === task.category);
  const days = task.weekdays.length === 7 ? "Every day" : task.weekdays.map((i) => ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"][i]).join(" ");
  const reps = task.targetCount > 1 ? ` · ${task.targetCount}x/day` : "";
  const bell = task.remind ? ` · 🔔 ${task.remindFrom}–${task.remindTo}` : "";
  const oneTimeTag = task.oneTime && !task.isDaily ? " · One-time" : "";
  return (
    <div className="flex items-center gap-2 py-2.5 px-3 rounded-xl" style={{ background: SURFACE }}>
      {task.isDaily ? (
        <span style={{ width: 22, flexShrink: 0 }} />

        <button onClick={onToggleDone} style={{
          width: 22, height: 22, borderRadius: 6, flexShrink: 0,
          border: `2px solid ${task.done ? ACCENT : BORDER}`,
          background: task.done ? ACCENT : "transparent",
          display: "flex", alignItems: "center", justifyContent: "center",

          {task.done && <span style={{ color: WHITE, fontSize: 14, fontWeight: 800 }}>✓</span>}

      <div className="flex-1 min-w-0">
        <div style={{ fontSize: 14, textDecoration: task.done && !task.isDaily ? "line-through" : "none", color: task.done && !task.isDaily ? MUTED : TEXT }}>
          {task.name}
        </div>
        <div style={{ fontSize: 11, color: MUTED }}>
          {cat?.label}{task.isDaily ? ` · ${days}` : ""}{reps}{bell}{oneTimeTag}
        </div>
      </div>
      <div className="flex flex-col items-center gap-0.5" style={{ flexShrink: 0 }}>
        <Toggle on={task.isDaily} onClick={onToggleDaily} />

function ProjectDetailView({ project, items, onBack, onEditProject, onAddItem, onEditItem, onToggleItem }) {
  if (!project) return null;
  const total = items.length, done = items.filter((i) => i.done).length;
  const unscheduled = items.filter((i) => !i.date);
  const scheduled = items.filter((i) => i.date).sort((a, b) => a.date.localeCompare(b.date));
  const groups = {};
  scheduled.forEach((i) => { (groups[i.date] = groups[i.date] || []).push(i); });
  const dateKeys = Object.keys(groups).sort();
  return (
    <div className="px-5 pt-6 pb-8">
      <div className="flex items-center gap-2 mb-1">
        <button onClick={onBack} style={{ color: MUTED, fontSize: 20 }}>‹</button>

        <button onClick={onEditProject} style={{ color: MUTED, fontSize: 14 }}>✎</button>
      </div>
      <div style={{ fontSize: 12, color: MUTED, marginBottom: 8, marginLeft: 26 }}>{total ? `${done}/${total} complete` : "No to-dos yet"}</div>
      {project.isShared && (
        <div style={{ fontSize: 11, color: MUTED, marginBottom: 20, marginLeft: 26 }}>
          With: {project.memberEmails.map((e) => emailShort(e)).join(", ")}
        </div>
      )}
      {!project.isShared && <div style={{ marginBottom: 12 }} />}
      {unscheduled.length > 0 && (
        <div className="mb-5">
          <div style={{ fontSize: 11, color: MUTED, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 8 }}>To-do</div>
          <div className="space-y-2">
            {unscheduled.map((i) => (<ProjectItemRow key={i.id} item={i} onToggle={() => onToggleItem(i.id)} onEdit={() => onEditItem(i)} />))}
          </div>
        </div>
      )}
      {dateKeys.map((dk) => (
        <div key={dk} className="mb-5">
          <div style={{ fontSize: 11, color: MUTED, letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 8 }}>
            {new Date(`${dk}T00:00:00`).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" })}
          </div>
          <div className="space-y-2">
            {groups[dk].map((i) => (<ProjectItemRow key={i.id} item={i} onToggle={() => onToggleItem(i.id)} onEdit={() => onEditItem(i)} />))}
          </div>
        </div>
      ))}
      {items.length === 0 && <EmptyState message="No to-dos in this project yet." cta="Add one" onClick={() => onAddItem()} />}
      {items.length > 0 && (
        <button onClick={() => onAddItem()} className="w-full py-3 rounded-xl flex items-center justify-center gap-2" style={{ background: SURFACE, border: `1px solid ${BORDER}`, color: TEXT }}>
          + Add to-do
        </button>
      )}
    </div>
  );
}

function ProjectFormSheet({ sheet, myEmail, onCancel, onSubmit, onDelete, onInvite }) {
  const isEdit = !!sheet.initial;
  const initial = sheet.initial || { name: "", color: PROJECT_COLORS[0] };
  const [name, setName] = useState(initial.name);
  const [color, setColor] = useState(initial.color);
  const [shared, setShared] = useState(initial.isShared ?? false);
  const [emailsText, setEmailsText] = useState("");
  const [inviteText, setInviteText] = useState("");

  const submit = () => {
    if (!name.trim()) return;
    if (isEdit) { onSubmit({ name: name.trim(), color }, initial.id); return; }
    if (shared) {
      const invites = emailsText.split(",").map((e) => e.trim()).filter(Boolean);
      onSubmit({ name: name.trim(), color, isShared: true, memberEmails: [myEmail, ...invites] }, null);
    } else {
      onSubmit({ name: name.trim(), color, isShared: false }, null);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ background: "rgba(0,0,0,0.55)" }}>
      <div onClick={(e) => e.stopPropagation()} className="w-full rounded-t-3xl p-5" style={{ maxWidth: 430, background: SURFACE, maxHeight: "88vh", overflowY: "auto" }}>
        <div className="flex justify-between items-center mb-4">
          <div style={{ fontFamily: "Fraunces, serif", fontSize: 18, fontWeight: 600, color: TEXT }}>{isEdit ? "Edit project" : "New project"}</div>
          <button onClick={onCancel} style={{ color: MUTED, fontSize: 18 }}>×</button>
        </div>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Project name" className="w-full px-4 py-3 rounded-xl mb-4" style={{ background: SURFACE2, color: TEXT, border: `1px solid ${BORDER}`, fontSize: 14 }} />
        <div className="flex flex-wrap gap-2 mb-6">
          {PROJECT_COLORS.map((c) => (
            <button key={c} onClick={() => setColor(c)} style={{ width: 32, height: 32, borderRadius: "50%", background: c, border: color === c ? `2px solid ${WHITE}` : "2px solid transparent" }} />
          ))}
        </div>

        {!isEdit && (
          <div className="flex items-center justify-between mb-4 px-1">
            <div>
              <div style={{ fontSize: 14, color: TEXT }}>Share with others</div>
              <div style={{ fontSize: 11, color: MUTED }}>Everyone can see who's assigned and who's finished what</div>
            </div>
            <Toggle on={shared} onClick={() => setShared((v) => !v)} />
          </div>
        )}
        {!isEdit && shared && (
          <div className="mb-6">
            <div style={{ fontSize: 12, color: MUTED, marginBottom: 6 }}>Invite by email (comma-separated)</div>
            <input value={emailsText} onChange={(e) => setEmailsText(e.target.value)} placeholder="friend@gmail.com, other@gmail.com" className="w-full px-4 py-3 rounded-xl" style={{ background: SURFACE2, color: TEXT, border: `1px solid ${BORDER}`, fontSize: 14 }} />
          </div>
        )}

        {isEdit && initial.isShared && (
          <div className="mb-6">
            <div style={{ fontSize: 12, color: MUTED, marginBottom: 6 }}>With: {initial.memberEmails.map((e) => emailShort(e)).join(", ")}</div>
            <div className="flex gap-2">
              <input value={inviteText} onChange={(e) => setInviteText(e.target.value)} placeholder="Add someone's email" className="flex-1 px-4 py-3 rounded-xl" style={{ background: SURFACE2, color: TEXT, border: `1px solid ${BORDER}`, fontSize: 14 }} />
              <button onClick={() => { if (inviteText.trim()) { onInvite(initial.id, inviteText.trim()); setInviteText(""); } }} className="px-4 rounded-xl" style={{ background: SURFACE2, border: `1px solid ${BORDER}`, color: TEXT, fontSize: 13 }}>Add</button>
            </div>
          </div>
        )}

        <button onClick={submit} className="w-full py-3 rounded-xl mb-2" style={{ background: ACCENT, color: WHITE, fontWeight: 700, fontSize: 14 }}>
          {isEdit ? "Save changes" : "Create project"}
        </button>
        {isEdit && (
          <button onClick={() => onDelete(initial.id)} className="w-full py-3 rounded-xl flex items-center justify-center gap-2" style={{ color: DANGER, fontSize: 13 }}>
            🗑 Delete project (and its to-dos)

              {memberEmails.map((em) => (

              ))}

/* ---------- day detail (calendar) ---------- */

    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ background: "rgba(0,0,0,0.55)" }} onClick={onClose}>

          <div style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, color: TEXT }}>{d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}</div>
          <button onClick={onClose} style={{ color: MUTED, fontSize: 18 }}>×</button>
        </div>
        {!tasks ? (
          <div className="text-center py-8">

          </div>

          <>
            <div className="flex justify-center mb-5"><RingProgress tasks={tasks} categories={categories} size={88} thickness={9} /></div>
            {activeCats.length > 0 && (
              <div className="space-y-3 mb-5">
                {activeCats.map((cat) => {

function TaskFormSheet({ sheet, categories, onCancel, onSubmitTask, onSubmitOneOff, onDelete }) {
  const isDayAdd = sheet.context === "day-add";
  const isEdit = sheet.context === "edit";
  const initial = sheet.initial || { name: "", category: categories[0]?.id, isDaily: true, weekdays: [0, 1, 2, 3, 4, 5, 6], targetCount: 1, remind: false, remindFrom: "09:00", remindTo: "18:00", oneTime: false };
  const [name, setName] = useState(initial.name);
  const [category, setCategory] = useState(initial.category);
  const [isDaily, setIsDaily] = useState(initial.isDaily ?? false);
  const [weekdays, setWeekdays] = useState(initial.weekdays ?? [0, 1, 2, 3, 4, 5, 6]);
  const [targetCount, setTargetCount] = useState(initial.targetCount || 1);
  const [remind, setRemind] = useState(initial.remind ?? false);
  const [remindFrom, setRemindFrom] = useState(initial.remindFrom ?? "09:00");
  const [remindTo, setRemindTo] = useState(initial.remindTo ?? "18:00");
  const [oneTime, setOneTime] = useState(initial.oneTime ?? false);

  const toggleWeekday = (i) => setWeekdays((w) => (w.includes(i) ? w.filter((x) => x !== i) : [...w, i].sort()));

  const submit = () => {
    if (!name.trim()) return;
    if (isDayAdd) {
      onSubmitOneOff({ name: name.trim(), category, targetCount });
      return;
    }
    let from = remindFrom, to = remindTo;
    if (remind && from >= to) { const tmp = from; from = to; to = tmp; }
    onSubmitTask(
      { name: name.trim(), category, isDaily, weekdays: normalizeWeekdays(weekdays), targetCount, remind: isDaily && remind, remindFrom: from, remindTo: to, oneTime: !isDaily && oneTime },
      isEdit ? initial.id : null
    );
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ background: "rgba(0,0,0,0.55)" }}>
      <div onClick={(e) => e.stopPropagation()} className="w-full rounded-t-3xl p-5" style={{ maxWidth: 430, background: SURFACE, maxHeight: "88vh", overflowY: "auto" }}>
        <div className="flex justify-between items-center mb-4">
          <div style={{ fontFamily: "Fraunces, serif", fontSize: 18, fontWeight: 600, color: TEXT }}>{isEdit ? "Edit task" : isDayAdd ? "Add task for this day" : "Add a task"}</div>
          <button onClick={onCancel} style={{ color: MUTED, fontSize: 18 }}>×</button>
        </div>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Task name" className="w-full px-4 py-3 rounded-xl mb-4" style={{ background: SURFACE2, color: TEXT, border: `1px solid ${BORDER}`, fontSize: 14 }} />
        <div className="flex flex-wrap gap-2 mb-4">
          {categories.map((cat) => (
            <button key={cat.id} onClick={() => setCategory(cat.id)} className="px-3 py-2 rounded-full flex items-center gap-2" style={{ border: `1.5px solid ${category === cat.id ? cat.color : BORDER}`, background: category === cat.id ? hexToRgba(cat.color, 0.15) : "transparent" }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: cat.color }} />
              <span style={{ fontSize: 12, color: TEXT }}>{cat.label}</span>
            </button>
          ))}
        </div>

        <div className="flex items-center justify-between mb-4 px-1">
          <div>
            <div style={{ fontSize: 14, color: TEXT }}>Times per day</div>
            <div style={{ fontSize: 11, color: MUTED }}>Complete it this many times to finish</div>
          </div>
          <Stepper value={targetCount} onDec={() => setTargetCount((c) => Math.max(1, c - 1))} onInc={() => setTargetCount((c) => Math.min(20, c + 1))} />
        </div>

        {!isDayAdd && (
          <>
            <div className="flex items-center justify-between mb-4 px-1">
              <div>
                <div style={{ fontSize: 14, color: TEXT }}>Daily</div>
                <div style={{ fontSize: 11, color: MUTED }}>Show this in Today's checklist</div>
              </div>
              <Toggle on={isDaily} onClick={() => setIsDaily((v) => !v)} />
            </div>
            {isDaily && (
              <>
                <div className="mb-5">
                  <div style={{ fontSize: 12, color: MUTED, marginBottom: 8 }}>Repeats on</div>
                  <div className="flex gap-2">
                    {["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].map((d, i) => (
                      <button key={i} onClick={() => toggleWeekday(i)} style={{ width: 34, height: 34, borderRadius: "50%", fontSize: 11, fontWeight: 600, background: weekdays.includes(i) ? ACCENT : "transparent", color: weekdays.includes(i) ? WHITE : MUTED, border: `1px solid ${weekdays.includes(i) ? ACCENT : BORDER}` }}>
                        {d}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="flex items-center justify-between mb-4 px-1">
                  <div>
                    <div style={{ fontSize: 14, color: TEXT }}>Remind me</div>
                    <div style={{ fontSize: 11, color: MUTED }}>Browser notification, sometime in a window</div>
                  </div>
                  <Toggle on={remind} onClick={() => setRemind((v) => !v)} />
                </div>
                {remind && (
                  <div className="flex items-center gap-3 mb-5 px-1">
                    <div className="flex-1">
                      <div style={{ fontSize: 11, color: MUTED, marginBottom: 4 }}>From</div>
                      <input type="time" value={remindFrom} onChange={(e) => setRemindFrom(e.target.value)} className="w-full px-3 py-2 rounded-lg" style={{ background: SURFACE2, color: TEXT, border: `1px solid ${BORDER}`, fontSize: 13 }} />
                    </div>
                    <div className="flex-1">
                      <div style={{ fontSize: 11, color: MUTED, marginBottom: 4 }}>To</div>
                      <input type="time" value={remindTo} onChange={(e) => setRemindTo(e.target.value)} className="w-full px-3 py-2 rounded-lg" style={{ background: SURFACE2, color: TEXT, border: `1px solid ${BORDER}`, fontSize: 13 }} />
                    </div>
                  </div>
                )}
              </>
            )}
            {!isDaily && (
              <div className="flex items-center justify-between mb-4 px-1">
                <div>
                  <div style={{ fontSize: 14, color: TEXT }}>One-time</div>
                  <div style={{ fontSize: 11, color: MUTED }}>Remove it automatically once you check it off</div>
                </div>
                <Toggle on={oneTime} onClick={() => setOneTime((v) => !v)} />
              </div>
            )}
          </>
        )}
        <button onClick={submit} className="w-full py-3 rounded-xl mb-2" style={{ background: ACCENT, color: WHITE, fontWeight: 700, fontSize: 14 }}>{isEdit ? "Save changes" : "Add task"}</button>
        {isEdit && (
          <button onClick={() => onDelete(initial.id)} className="w-full py-3 rounded-xl flex items-center justify-center gap-2" style={{ color: DANGER, fontSize: 13 }}>
            🗑 Delete task
          </button>
        )}
      </div>
    </div>
  );
}

/* ---------- app ---------- */
function App() {
  const [fb, setFb] = useState(null);
  const [authUser, setAuthUser] = useState(undefined);
  const [authError, setAuthError] = useState(null);
  const [data, setData] = useState({ tasks: [], dailyLogs: {}, categories: DEFAULT_CATEGORIES, projects: [], projectItems: [], somedayLabel: "Someday" });
  const [loaded, setLoaded] = useState(false);
  const [syncError, setSyncError] = useState(false);
  const [view, setView] = useState("today");
  const [monthDate, setMonthDate] = useState(new Date());
  const [detailDateKey, setDetailDateKey] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [categorySheet, setCategorySheet] = useState(null);
  const [labelSheetOpen, setLabelSheetOpen] = useState(false);
  const [activeProjectId, setActiveProjectId] = useState(null);
  const [projectSheet, setProjectSheet] = useState(null);
  const [itemSheet, setItemSheet] = useState(null);
  const [notifPermission, setNotifPermission] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
  const [installEvent, setInstallEvent] = useState(null);
  const [installMsg, setInstallMsg] = useState(null);
  const [celebration, setCelebration] = useState(null);
  const [todayKey, setTodayKey] = useState(dateKey(new Date()));
  const [sharedProjects, setSharedProjects] = useState([]);
  const [inboxItems, setInboxItems] = useState([]);
  const [inboxOpen, setInboxOpen] = useState(false);

  const dataRef = useRef(data);
  useEffect(() => { dataRef.current = data; }, [data]);
  const prevCompleteRef = useRef(null);

  useEffect(() => {
    let unsub = () => {};
    whenFirebaseReady((fbApi) => {
      setFb(fbApi);
      unsub = fbApi.onAuthStateChanged(fbApi.auth, (user) => setAuthUser(user || null));
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!fb || !authUser) return;
    setLoaded(false);
    setSyncError(false);
    const ref = fb.doc(fb.db, DOC_COLLECTION, authUser.uid);
    const unsub = fb.onSnapshot(
      ref,
      (snap) => {
        let raw = { tasks: [], dailyLogs: {} };
        const existingRaw = snap.exists() ? snap.data().data : null;
        if (existingRaw) { try { raw = JSON.parse(existingRaw); } catch (e) {} }
        const migrated = migrate(raw);
        setData(migrated);
        setLoaded(true);
      },
      (err) => { console.error("Snapshot error", err); setSyncError(true); }
    );
    return () => unsub();
  }, [fb, authUser]);

  const loadedRef = useRef(false);
  useEffect(() => { loadedRef.current = loaded; }, [loaded]);

  const myEmail = authUser?.email || null;

  // live: any project shared with me
  useEffect(() => {
    if (!fb || !myEmail) { setSharedProjects([]); return; }
    const q = fb.query(fb.collection(fb.db, SHARED_PROJECTS_COLLECTION), fb.where("memberEmails", "array-contains", myEmail));
    const unsub = fb.onSnapshot(q, (snap) => {
      const list = snap.docs.map((d) => {
        const raw = d.data();
        let payload = { name: "Untitled", color: PROJECT_COLORS[0], items: [] };
        try { payload = JSON.parse(raw.payload); } catch (e) {}
        return { id: d.id, isShared: true, ownerEmail: raw.ownerEmail, memberEmails: raw.memberEmails || [], name: payload.name, color: payload.color, items: payload.items || [] };
      });
      setSharedProjects(list);
    }, (err) => console.error("Shared projects error", err));
    return () => unsub();
  }, [fb, myEmail]);

  // live: to-dos someone has sent to me, still pending
  useEffect(() => {
    if (!fb || !myEmail) { setInboxItems([]); return; }
    const q = fb.query(fb.collection(fb.db, SENT_TASKS_COLLECTION), fb.where("toEmail", "==", myEmail), fb.where("status", "==", "pending"));
    const unsub = fb.onSnapshot(q, (snap) => {
      setInboxItems(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    }, (err) => console.error("Inbox error", err));
    return () => unsub();
  }, [fb, myEmail]);

  const mutate = useCallback((updater) => {
    setData((prev) => {
      const next = updater(prev);
      // never write until we've confirmed the real data has loaded at least once —
      // writing before that is what could overwrite real data with an empty default
      if (fb && authUser && loadedRef.current) {
        const ref = fb.doc(fb.db, DOC_COLLECTION, authUser.uid);
        fb.setDoc(ref, { data: JSON.stringify(next), updatedAt: Date.now() }).catch((e) => console.error("Save failed", e));
      }
      return next;
    });
  }, [fb, authUser]);

  // keep "today" rolling forward automatically, without needing any interaction in Tasks
  useEffect(() => {
    const interval = setInterval(() => {
      const nowKey = dateKey(new Date());
      setTodayKey((prevKey) => (prevKey !== nowKey ? nowKey : prevKey));
    }, 30000);
    return () => clearInterval(interval);
  }, []);
  useEffect(() => {
    if (!loaded) return;
    mutate((prev) => generateIfNeeded(prev, todayKey));
  }, [todayKey, loaded]);

  // notifications for daily tasks with reminders on, while this tab stays open
  useEffect(() => {
    if (typeof Notification === "undefined") return;
    const timers = [];
    data.tasks.filter((t) => t.isDaily && t.remind).forEach((t) => {
      const target = seededTimeWithinWindow(todayKey, t.id, t.remindFrom, t.remindTo);
      const delay = target - Date.now();
      if (delay <= 0) return;
      const timer = setTimeout(() => {
        if (Notification.permission !== "granted") return;
        const todayTasks = dataRef.current.dailyLogs[todayKey] || [];
        const instance = todayTasks.find((i) => i.taskId === t.id);
        if (instance && instance.done) return;
        new Notification("Ledger", { body: t.name });
      }, delay);
      timers.push(timer);
    });
    return () => timers.forEach(clearTimeout);
  }, [data.tasks, todayKey]);

  // celebrate hitting 100% for today (fires once per transition, not on reload)
  useEffect(() => {
    const tasks = data.dailyLogs[todayKey];
    if (!tasks || tasks.length === 0) { prevCompleteRef.current = false; return; }
    const isComplete = tasks.every((t) => t.done);
    if (prevCompleteRef.current === false && isComplete) {
      const msg = CELEBRATION_MESSAGES[Math.floor(Math.random() * CELEBRATION_MESSAGES.length)];
      setCelebration(msg);
    }
    prevCompleteRef.current = isComplete;
  }, [data.dailyLogs, todayKey]);

  // capture the native install prompt when the browser offers one (Android/Chrome/desktop)
  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setInstallEvent(e); };
    window.addEventListener("beforeinstallprompt", handler);
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);

  const handleInstallClick = async () => {
    if (isStandalone()) { setInstallMsg("Already installed — check your home screen."); return; }
    if (installEvent) {
      installEvent.prompt();
      await installEvent.userChoice;
      setInstallEvent(null);
      setInstallMsg(null);
      return;
    }
    setInstallMsg('Look for "Install app" or "Add to Home Screen" in your browser\'s menu (⋮ or the address bar).');
  };

  const handleSignIn = async () => {
    setAuthError(null);
    try { await fb.signInWithPopup(fb.auth, fb.provider); }
    catch (e) { setAuthError("Sign-in failed. Please try again."); console.error(e); }
  };
  const handleSignOut = () => { fb.signOut(fb.auth); setData({ tasks: [], dailyLogs: {}, categories: DEFAULT_CATEGORIES, projects: [], projectItems: [], somedayLabel: "Someday" }); setLoaded(false); };
  const handleEnableNotifications = () => { Notification.requestPermission().then((p) => setNotifPermission(p)); };
  const handleExport = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ledger-backup-${todayKey}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  const openSheet = (context, initial = null) => setSheet({ context, initial });
  const closeSheet = () => setSheet(null);
  const openCategorySheet = (initial = null) => setCategorySheet({ initial });
  const closeCategorySheet = () => setCategorySheet(null);
  const openProjectSheet = (initial = null) => setProjectSheet({ initial });
  const closeProjectSheet = () => setProjectSheet(null);
  const openItemSheet = (initial = null) => setItemSheet({ initial });
  const closeItemSheet = () => setItemSheet(null);
  const handleRenameSomeday = (label) => { mutate((prev) => ({ ...prev, somedayLabel: label })); setLabelSheetOpen(false); };

  const handleTapTask = (dk, taskInstanceId) => mutate((prev) => ({
    ...prev,
    dailyLogs: {
      ...prev.dailyLogs,
      [dk]: prev.dailyLogs[dk].map((t) => {
        if (t.id !== taskInstanceId) return t;
        const target = t.targetCount || 1;
        const count = t.count || 0;
        if (count >= target) return { ...t, count: 0, done: false };
        const newCount = count + 1;
        return { ...t, count: newCount, done: newCount >= target };
      }),
    },
  }));

  const handleRemove = (dk, taskInstanceId) => mutate((prev) => ({ ...prev, dailyLogs: { ...prev.dailyLogs, [dk]: prev.dailyLogs[dk].filter((t) => t.id !== taskInstanceId) } }));
  const handleGenerateDay = (dk) => mutate((prev) => generateIfNeeded(prev, dk));

  const handleAddOneOff = (dk, { name, category, targetCount }) => mutate((prev) => {
    const p = generateIfNeeded(prev, dk);
    const list = p.dailyLogs[dk] || [];
    return { ...p, dailyLogs: { ...p.dailyLogs, [dk]: [...list, { id: uid("o"), name, category, done: false, taskId: null, targetCount: targetCount || 1, count: 0 }] } };
  });

  const handleAddTask = ({ name, category, isDaily, weekdays, targetCount, remind, remindFrom, remindTo, oneTime }) => mutate((prev) => {
    const base = generateIfNeeded(prev, todayKey);
    const wk = normalizeWeekdays(weekdays);
    const newTask = { id: uid("m"), name, category, isDaily, weekdays: wk, done: false, targetCount: targetCount || 1, remind: !!remind, remindFrom, remindTo, oneTime: !!oneTime };
    const tasks = [...base.tasks, newTask];
    const todayLog = base.dailyLogs[todayKey] || [];
    let dailyLogs = base.dailyLogs;
    if (isDaily && wk.includes(new Date().getDay())) {
      dailyLogs = { ...dailyLogs, [todayKey]: [...todayLog, { id: uid("t"), name, category, done: false, taskId: newTask.id, targetCount: newTask.targetCount, count: 0 }] };
    }
    return { ...base, tasks, dailyLogs };
  });

  const handleEditTask = (id, { name, category, isDaily, weekdays, targetCount, remind, remindFrom, remindTo, oneTime }) => mutate((prev) => {
    const base = generateIfNeeded(prev, todayKey);
    const wk = normalizeWeekdays(weekdays);
    const tasks = base.tasks.map((t) => (t.id === id ? { ...t, name, category, isDaily, weekdays: wk, done: isDaily ? false : t.done, targetCount: targetCount || 1, remind: !!remind, remindFrom, remindTo, oneTime: !!oneTime } : t));
    const todayLog = base.dailyLogs[todayKey] || [];
    const wd = new Date().getDay();
    const existing = todayLog.find((t) => t.taskId === id);
    const shouldAppear = isDaily && wk.includes(wd);
    let dailyLogs = base.dailyLogs;
    if (shouldAppear && !existing) {
      dailyLogs = { ...dailyLogs, [todayKey]: [...todayLog, { id: uid("t"), name, category, done: false, taskId: id, targetCount: targetCount || 1, count: 0 }] };
    } else if (!shouldAppear && existing) {
      dailyLogs = { ...dailyLogs, [todayKey]: todayLog.filter((t) => t.taskId !== id) };
    } else if (shouldAppear && existing) {
      dailyLogs = { ...dailyLogs, [todayKey]: todayLog.map((t) => (t.taskId === id ? { ...t, name, category, targetCount: targetCount || 1 } : t)) };
    }
    return { ...base, tasks, dailyLogs };
  });

  const handleToggleDaily = (id) => mutate((prev) => {
    const base = generateIfNeeded(prev, todayKey);
    const task = base.tasks.find((t) => t.id === id);
    if (!task) return base;
    const newIsDaily = !task.isDaily;
    const tasks = base.tasks.map((t) => (t.id === id ? { ...t, isDaily: newIsDaily, done: newIsDaily ? false : t.done } : t));
    const todayLog = base.dailyLogs[todayKey] || [];
    const wd = new Date().getDay();
    const existing = todayLog.find((t) => t.taskId === id);
    let dailyLogs = base.dailyLogs;
    if (newIsDaily && task.weekdays.includes(wd) && !existing) {
      dailyLogs = { ...dailyLogs, [todayKey]: [...todayLog, { id: uid("t"), name: task.name, category: task.category, done: false, taskId: id, targetCount: task.targetCount || 1, count: 0 }] };
    } else if (!newIsDaily && existing) {
      dailyLogs = { ...dailyLogs, [todayKey]: todayLog.filter((t) => t.taskId !== id) };
    }
    return { ...base, tasks, dailyLogs };
  });

  const handleToggleDone = (id) => mutate((prev) => {
    const task = prev.tasks.find((t) => t.id === id);
    if (!task) return prev;
    if (!task.done && task.oneTime) {
      return { ...prev, tasks: prev.tasks.filter((t) => t.id !== id) };
    }
    return { ...prev, tasks: prev.tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t)) };
  });

  const handleDeleteTask = (id) => mutate((prev) => {
    const tasks = prev.tasks.filter((t) => t.id !== id);
    const todayLog = prev.dailyLogs[todayKey] || [];
    const dailyLogs = { ...prev.dailyLogs, [todayKey]: todayLog.filter((t) => t.taskId !== id) };
    return { ...prev, tasks, dailyLogs };
  });

  const handleAddCategory = ({ label, color }) => mutate((prev) => ({ ...prev, categories: [...prev.categories, { id: uid("cat"), label, color }] }));
  const handleEditCategory = (id, { label, color }) => mutate((prev) => ({ ...prev, categories: prev.categories.map((c) => (c.id === id ? { ...c, label, color } : c)) }));
  const handleDeleteCategory = (id) => mutate((prev) => {
    if (prev.tasks.some((t) => t.category === id)) return prev;
    return { ...prev, categories: prev.categories.filter((c) => c.id !== id) };
  });

  const handleAddProject = ({ name, color }) => mutate((prev) => ({ ...prev, projects: [...prev.projects, { id: uid("proj"), name, color }] }));
  const handleEditProject = (id, { name, color }) => mutate((prev) => ({ ...prev, projects: prev.projects.map((p) => (p.id === id ? { ...p, name, color } : p)) }));
  const handleDeleteProject = (id) => mutate((prev) => ({ ...prev, projects: prev.projects.filter((p) => p.id !== id), projectItems: prev.projectItems.filter((it) => it.projectId !== id) }));
  const handleAddItem = (projectId, { name, date, assignee }) => mutate((prev) => ({ ...prev, projectItems: [...prev.projectItems, { id: uid("pit"), projectId, name, date: date || null, done: false, assignee: assignee || null, doneBy: null }] }));
  const handleEditItem = (id, { name, date, assignee }) => mutate((prev) => ({ ...prev, projectItems: prev.projectItems.map((it) => (it.id === id ? { ...it, name, date: date || null, assignee: assignee || null } : it)) }));
  const handleDeleteItem = (id) => mutate((prev) => ({ ...prev, projectItems: prev.projectItems.filter((it) => it.id !== id) }));
  const handleToggleItem = (id) => mutate((prev) => ({ ...prev, projectItems: prev.projectItems.map((it) => (it.id === id ? { ...it, done: !it.done, doneBy: !it.done ? myEmail : null } : it)) }));

  // shared projects live in their own Firestore collection so every member sees live updates
  const sharedProjectRef = (id) => fb.doc(fb.db, SHARED_PROJECTS_COLLECTION, id);
  const writeSharedPayload = (id, memberEmails, ownerEmail, payload) =>
    fb.setDoc(sharedProjectRef(id), { memberEmails, ownerEmail, payload: JSON.stringify(payload), updatedAt: Date.now() }).catch((e) => console.error("Shared project save failed", e));

  const handleCreateSharedProject = ({ name, color, memberEmails }) => {
    fb.addDoc(fb.collection(fb.db, SHARED_PROJECTS_COLLECTION), {
      memberEmails, ownerEmail: myEmail, payload: JSON.stringify({ name, color, items: [] }), updatedAt: Date.now(),
    }).catch((e) => console.error("Create shared project failed", e));
  };
  const handleEditSharedProject = (id, { name, color }) => {
    const p = sharedProjects.find((sp) => sp.id === id);
    if (!p) return;
    writeSharedPayload(id, p.memberEmails, p.ownerEmail, { name, color, items: p.items });
  };
  const handleDeleteSharedProject = (id) => { fb.deleteDoc(sharedProjectRef(id)).catch((e) => console.error("Delete shared project failed", e)); };
  const handleInviteToSharedProject = (id, email) => { fb.updateDoc(sharedProjectRef(id), { memberEmails: fb.arrayUnion(email) }).catch((e) => console.error("Invite failed", e)); };
  const handleAddSharedItem = (projectId, { name, date, assignee }) => {
    const p = sharedProjects.find((sp) => sp.id === projectId);
    if (!p) return;
    const items = [...p.items, { id: uid("pit"), name, date: date || null, done: false, assignee: assignee || null, doneBy: null }];
    writeSharedPayload(projectId, p.memberEmails, p.ownerEmail, { name: p.name, color: p.color, items });
  };
  const handleEditSharedItem = (projectId, itemId, { name, date, assignee }) => {
    const p = sharedProjects.find((sp) => sp.id === projectId);
    if (!p) return;
    const items = p.items.map((it) => (it.id === itemId ? { ...it, name, date: date || null, assignee: assignee || null } : it));
    writeSharedPayload(projectId, p.memberEmails, p.ownerEmail, { name: p.name, color: p.color, items });
  };
  const handleDeleteSharedItem = (projectId, itemId) => {
    const p = sharedProjects.find((sp) => sp.id === projectId);
    if (!p) return;
    const items = p.items.filter((it) => it.id !== itemId);
    writeSharedPayload(projectId, p.memberEmails, p.ownerEmail, { name: p.name, color: p.color, items });
  };
  const handleToggleSharedItem = (projectId, itemId) => {
    const p = sharedProjects.find((sp) => sp.id === projectId);
    if (!p) return;
    const items = p.items.map((it) => (it.id === itemId ? { ...it, done: !it.done, doneBy: !it.done ? myEmail : null } : it));
    writeSharedPayload(projectId, p.memberEmails, p.ownerEmail, { name: p.name, color: p.color, items });
  };

  // sending a to-do to someone else's account, and accepting/declining what's sent to you
  const handleSendToInbox = ({ toEmail, name, category }) => {
    fb.addDoc(fb.collection(fb.db, SENT_TASKS_COLLECTION), { toEmail, fromEmail: myEmail, name, category, status: "pending", createdAt: Date.now() })
      .catch((e) => console.error("Send failed", e));
  };
  const handleAcceptInbox = (item) => {
    handleAddTask({ name: item.name, category: item.category, isDaily: false, weekdays: [0, 1, 2, 3, 4, 5, 6], targetCount: 1, remind: false, remindFrom: "09:00", remindTo: "18:00", oneTime: true });
    fb.deleteDoc(fb.doc(fb.db, SENT_TASKS_COLLECTION, item.id)).catch((e) => console.error("Accept cleanup failed", e));
  };
  const handleDeclineInbox = (id) => { fb.deleteDoc(fb.doc(fb.db, SENT_TASKS_COLLECTION, id)).catch((e) => console.error("Decline failed", e)); };

  const onSubmitOneOff = (payload) => {
    const dk = sheet.context === "day-add" ? detailDateKey : todayKey;
    handleAddOneOff(dk, payload);
    closeSheet();
  };
  const onSubmitTask = (payload, editId) => {
    if (editId) handleEditTask(editId, payload);
    else handleAddTask(payload);
    closeSheet();
  };
  const onDeleteFromSheet = (id) => { handleDeleteTask(id); closeSheet(); };
  const onSubmitCategory = (payload, editId) => {
    if (editId) handleEditCategory(editId, payload);
    else handleAddCategory(payload);
    closeCategorySheet();
  };
  const onDeleteCategoryFromSheet = (id) => { handleDeleteCategory(id); closeCategorySheet(); };
  const onSubmitProject = (payload, editId) => {
    if (editId) {
      if (sharedProjects.some((p) => p.id === editId)) handleEditSharedProject(editId, payload);
      else handleEditProject(editId, payload);
    } else {
      if (payload.isShared) handleCreateSharedProject(payload);
      else handleAddProject(payload);
    }
    closeProjectSheet();
  };
  const onDeleteProjectFromSheet = (id) => {
    if (sharedProjects.some((p) => p.id === id)) handleDeleteSharedProject(id);
    else handleDeleteProject(id);
    setActiveProjectId(null);
    closeProjectSheet();
  };
  const onSubmitItem = (payload, editId) => {
    const isShared = sharedProjects.some((p) => p.id === activeProjectId);
    if (editId) {
      if (isShared) handleEditSharedItem(activeProjectId, editId, payload);
      else handleEditItem(editId, payload);
    } else {
      if (isShared) handleAddSharedItem(activeProjectId, payload);
      else handleAddItem(activeProjectId, payload);
    }
    closeItemSheet();
  };
  const onDeleteItemFromSheet = (id) => {
    if (sharedProjects.some((p) => p.id === activeProjectId)) handleDeleteSharedItem(activeProjectId, id);
    else handleDeleteItem(id);
    closeItemSheet();
  };

  const checkingAuth = authUser === undefined;
  const needsNotifPermission = data.tasks.some((t) => t.remind) && notifPermission === "default";
  const categoryInUse = categorySheet?.initial ? data.tasks.some((t) => t.category === categorySheet.initial.id) : false;
  const allProjects = [
    ...data.projects.map((p) => ({ ...p, isShared: false, items: data.projectItems.filter((i) => i.projectId === p.id) })),
    ...sharedProjects,
  ];
  const activeProject = allProjects.find((p) => p.id === activeProjectId) || null;

  return (
    <div className="w-full flex justify-center" style={{ background: "#0B0E13", minHeight: "100vh" }}>
      <div className="w-full flex flex-col overflow-hidden" style={{ maxWidth: 430, height: "100vh", background: BG, color: TEXT, fontFamily: "Inter, sans-serif" }}>
        {checkingAuth ? (
          <div className="flex-1 flex items-center justify-center" style={{ color: MUTED, fontSize: 13 }}>Loading…</div>
        ) : !authUser ? (
          <SignInScreen onSignIn={handleSignIn} error={authError} />
        ) : syncError ? (
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <div style={{ color: DANGER, fontSize: 14, marginBottom: 16 }}>Couldn't load your data. Nothing was changed — please check your connection and try again.</div>
            <button onClick={() => window.location.reload()} className="px-5 py-2.5 rounded-xl" style={{ background: ACCENT, color: WHITE, fontSize: 13, fontWeight: 700 }}>Retry</button>
          </div>
        ) : !loaded ? (
          <>
            <AccountBar user={authUser} onSignOut={handleSignOut} inboxCount={inboxItems.length} onOpenInbox={() => setInboxOpen(true)} />
            <div className="flex-1 flex items-center justify-center" style={{ color: MUTED, fontSize: 13 }}>Syncing…</div>
          </>
        ) : (
          <>
            <AccountBar user={authUser} onSignOut={handleSignOut} inboxCount={inboxItems.length} onOpenInbox={() => setInboxOpen(true)} />
            {needsNotifPermission && <NotifBanner onEnable={handleEnableNotifications} />}
            <div className="flex-1 overflow-y-auto">
              {view === "today" && <TodayView data={data} todayKey={todayKey} categories={data.categories} onTap={(id) => handleTapTask(todayKey, id)} onRemove={(id) => handleRemove(todayKey, id)} onOpenAdd={() => openSheet("add")} />}
              {view === "calendar" && <CalendarView data={data} categories={data.categories} monthDate={monthDate} setMonthDate={setMonthDate} onOpenDay={setDetailDateKey} />}
              {view === "projects" && (
                activeProject ? (
                  <ProjectDetailView
                    project={activeProject} items={activeProject.items}
                    onBack={() => setActiveProjectId(null)} onEditProject={() => openProjectSheet(activeProject)}
                    onAddItem={() => openItemSheet(null)} onEditItem={(it) => openItemSheet(it)}
                    onToggleItem={(id) => (activeProject.isShared ? handleToggleSharedItem(activeProject.id, id) : handleToggleItem(id))}
                  />
                ) : (
                  <ProjectsListView projects={allProjects} onOpenProject={setActiveProjectId} onAddProject={() => openProjectSheet(null)} />
                )
              )}
              {view === "manage" && (
                <ManageView
                  tasks={data.tasks} categories={data.categories}
                  somedayLabel={data.somedayLabel} onEditSomedayLabel={() => setLabelSheetOpen(true)}
                  onAddClick={() => openSheet("add")} onEditClick={(t) => openSheet("edit", t)}
                  onToggleDaily={handleToggleDaily} onToggleDone={handleToggleDone}
                  onAddCategory={() => openCategorySheet(null)} onEditCategory={(cat) => openCategorySheet(cat)}
                  iosMode={isIOS()} onInstallClick={handleInstallClick} installMsg={installMsg}
                  onExport={handleExport}
                />
              )}
            </div>
            <BottomNav view={view} setView={(v) => { setView(v); if (v !== "projects") setActiveProjectId(null); }} />
          </>
        )}
      </div>
      {sheet && <TaskFormSheet sheet={sheet} categories={data.categories} onCancel={closeSheet} onSubmitTask={onSubmitTask} onSubmitOneOff={onSubmitOneOff} onDelete={onDeleteFromSheet} />}
      {categorySheet && <CategoryFormSheet sheet={categorySheet} inUse={categoryInUse} onCancel={closeCategorySheet} onSubmit={onSubmitCategory} onDelete={onDeleteCategoryFromSheet} />}
      {labelSheetOpen && <LabelFormSheet initialLabel={data.somedayLabel} onCancel={() => setLabelSheetOpen(false)} onSubmit={handleRenameSomeday} />}
      {projectSheet && <ProjectFormSheet sheet={projectSheet} myEmail={myEmail} onCancel={closeProjectSheet} onSubmit={onSubmitProject} onDelete={onDeleteProjectFromSheet} onInvite={handleInviteToSharedProject} />}
      {itemSheet && <ItemFormSheet sheet={itemSheet} memberEmails={activeProject?.isShared ? activeProject.memberEmails : null} onCancel={closeItemSheet} onSubmit={onSubmitItem} onDelete={onDeleteItemFromSheet} />}
      {inboxOpen && <InboxSheet items={inboxItems} categories={data.categories} onClose={() => setInboxOpen(false)} onAccept={handleAcceptInbox} onDecline={handleDeclineInbox} onSend={handleSendToInbox} />}
      {detailDateKey && (
        <DayDetailSheet dateKeyStr={detailDateKey} data={data} categories={data.categories} onClose={() => setDetailDateKey(null)} onTap={(id) => handleTapTask(detailDateKey, id)} onRemove={(id) => handleRemove(detailDateKey, id)} onOpenAdd={() => openSheet("day-add")} onGenerate={() => handleGenerateDay(detailDateKey)} />
      )}
      {celebration && <CelebrationOverlay message={celebration} onClose={() => setCelebration(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
